name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./internal/...

      - name: Test
        # Retry once: a couple of backend tests spin up httptest servers and assert
        # on short timing windows, which can flake on a loaded runner. A real failure
        # reproduces on the retry; a one-off flake is absorbed.
        run: go test ./... -count=1 || (echo "::warning::go test flaked, retrying once" && go test ./... -count=1)

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check type-model drift
        run: npm run check-types

      - name: Typecheck
        run: npx tsc --noEmit
